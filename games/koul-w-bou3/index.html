<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كول وبوّع</title>
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#528c71">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <main class="container" id="app-shell">
        <header class="app-header" id="app-header"></header>

        <section id="online-setup-screen" class="screen active" aria-label="إعدادات الأونلاين">
            <h2>🌐 العب كول وبوّع أونلاين</h2>
            <p style="margin-bottom:24px;">كل واحد يلعب من تلفونو 📱</p>
            <div style="margin-bottom:20px;">
                <label style="font-weight:700; margin-bottom:8px; display:block;">اسمك:</label>
                <input type="text" id="online-player-name" placeholder="اسمك" maxlength="20" autocomplete="off"/>
            </div>
            <button id="create-room-btn" class="primary-btn">🏠 اعمل روم جديدة</button>
            <div class="divider">ادخل لروم موجودة</div>
            <div class="join-flow-group">
                <input type="text" id="room-code-input" class="code-input-lg" placeholder="ABCD12" maxlength="6" autocomplete="off"/>
                <button id="join-room-btn" class="primary-btn" style="flex:1; margin:0;">🚪 انضم</button>
            </div>
            <button id="coup-guide-from-setup-btn" class="secondary-btn coup-only-btn" type="button" style="margin-top:10px;">📖 دليل اللعب</button>
            <p id="online-setup-error" style="color:var(--danger-color); font-weight:700; margin-top:10px; text-align:center;"></p>
        </section>

        <section id="online-lobby-screen" class="screen" hidden aria-hidden="true">
            <h2>🕹️ الغرفة</h2>
            <div class="room-code-box">
                <span id="display-room-code" class="room-code">------</span>
                <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
                    <button id="copy-code-btn" class="icon-btn" style="width:auto; padding:0 20px;">📋 كوبي</button>
                    <button id="share-code-btn" class="primary-btn" style="width:auto; padding:10px 20px; margin:0;">📤 شارك</button>
                </div>
            </div>
            <div id="lobby-players-list" class="lobby-list"></div>
            <p id="lobby-wait-msg" style="text-align:center; font-weight:700;">⏳ نستنا لاعبين...</p>
            <button id="online-start-btn" class="primary-btn hidden">🚀 ابدا كول وبوّع</button>
            <button id="leave-room-btn" class="danger-btn" style="margin-top:16px;">🚪 اخرج</button>
        </section>

        <section id="coup-screen" class="screen" hidden aria-hidden="true">
            <div class="coup-topline">
                <div>
                    <h2 id="coup-title">👑 كول وبوّع</h2>
                    <p id="coup-subtitle">استنى دورك، كول، وبوّع كان تنجم.</p>
                </div>
                <div id="coup-deck-pill" class="coup-deck-pill"><span>🏦</span><strong>–</strong><span>🂠</span><strong>–</strong></div>
            </div>
            <div class="coup-status-wrap">
                <div id="coup-status" class="coup-status"></div>
                <div id="coup-action-timer" class="coup-action-timer">02:00</div>
            </div>
            <div id="coup-my-board" class="coup-player-board"></div>
            <div id="coup-10-coin-warning" class="coup-10-coin-warning hidden">عندك اكثر من 10 فرنك، لازم تعمل انقلاب</div>
            <div id="coup-action-panel" class="coup-action-panel"></div>
            <div id="coup-others-board" class="coup-player-board" style="margin-top:10px;"></div>
            <button id="coup-guide-btn" class="coup-guide-btn" type="button">كيفاش تلعب</button>
        </section>

        <section id="coup-guide-screen" class="screen" hidden aria-hidden="true">
            <div class="coup-guide-top">
                <button id="coup-guide-back-btn" class="coup-guide-back" type="button">↩ ارجع</button>
                <h2>دليل كول وبوّع</h2>
            </div>
            <div id="coup-guide-tabs" class="coup-guide-tabs"></div>
            <div id="coup-guide-content" class="coup-guide-content"></div>
        </section>
    </main>

    <div id="coup-turn-indicator" class="coup-turn-indicator hidden">
        <span class="cti-label">الدور على:</span>
        <strong id="cti-player-name">...</strong>
    </div>
    <div id="toast-msg" class="toast"></div>
    <script type="module" src="bootstrap.js"></script>
</body>
</html>
