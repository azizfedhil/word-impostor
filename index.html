<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dakheel - دخيل</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chkobba.css">
</head>
<body>
    <main class="container">
        
        <!-- Game Switch Navigation -->
        <nav id="game-switch-menu" class="game-switch-menu">
            <button type="button" class="game-switch-option" data-game-mode="spyfall">🕶️ ماناش هوني</button>
            <button type="button" class="game-switch-option" data-game-mode="coup">👑 كول وبوّع</button>
            <button type="button" class="game-switch-option" data-game-mode="chkobba">🃏 شكبّة</button>
        </nav>

        <!-- Mode Select Screen -->
        <section id="mode-select-screen" class="screen mode-select-screen">
            <header>
                <h1>اختار اللعبة</h1>
            </header>
            <div class="mode-choice-grid">
                <button type="button" class="mode-choice-card" data-game-mode="spyfall">
                    <span class="mode-choice-icon">🕶️</span>
                    <span class="mode-choice-title">ماناش هوني</span>
                    <span class="mode-choice-sub">شكون الدخيل فينا؟</span>
                </button>
                
                <button type="button" class="mode-choice-card" data-game-mode="coup">
                    <span class="mode-choice-icon">👑</span>
                    <span class="mode-choice-title">كول وبوّع</span>
                    <span class="mode-choice-sub">فلوس، تبلعيط، و"تكذب!"</span>
                </button>
                
                <button type="button" class="mode-choice-card" data-game-mode="chkobba">
                    <span class="mode-choice-icon">🃏</span>
                    <span class="mode-choice-title">شكبّة</span>
                    <span class="mode-choice-sub">العب الطرح التونسي الأصيل</span>
                </button>
            </div>
        </section>

        <!-- Other Existing Game Screens (Spyfall/Coup) would go here -->
        
        <!-- CHKOBBA SCREEN -->
        <section id="chkobba-screen" class="screen chkobba-screen" aria-label="لعبة الشكبة" hidden aria-hidden="true">
            <div id="chkobba-round-info" class="chkobba-info"></div>

            <div class="chkobba-stage">
                <div id="chkobba-opponents" class="chkobba-opponents"></div>

                <div id="chkobba-opening-panel" class="chkobba-opening-panel" hidden></div>

                <div class="chkobba-table-wrap">
                    <div class="chkobba-piles">
                        <div id="chkobba-deck-pile" class="chkobba-pile deck-pile"></div>
                        <div id="chkobba-my-capture-pile" class="chkobba-pile capture-pile"></div>
                    </div>
                    <div id="chkobba-table" class="chkobba-table"></div>
                </div>
            </div>

            <!-- The aria-live attribute ensures screen readers catch the turn state -->
            <div class="chkobba-hand-dock" aria-live="polite">
                <div class="not-your-turn-pill">⏳ دورك مازال...</div>
                
                <div class="chkobba-reactions-bar" id="chkobba-reactions">
                    <button type="button" aria-label="ضحك" data-reaction="laugh">😂</button>
                    <button type="button" aria-label="غش" data-reaction="angry">😤</button>
                    <button type="button" aria-label="تصفيق" data-reaction="clap">👏</button>
                    <button type="button" aria-label="تخمام" data-reaction="think">🤔</button>
                </div>
                
                <div class="chkobba-hand" id="chkobba-my-hand"></div>
            </div>

            <!-- Dedicated GPU layer to prevent layout thrashing during card flights -->
            <div id="chkobba-deal-layer" class="chkobba-deal-layer"></div>
        </section>

    </main><!-- end .container -->

    <!-- Scripts -->
    <script defer src="adult_words_data.js"></script>
    <script defer src="sounds.js"></script>
    <script defer src="chkobba_logic.js"></script>
    <script defer src="app.js"></script>
    <script defer src="online.js"></script>
    <script defer src="voice.js"></script>
    <script defer src="analytics.js"></script>
</body>
</html>
