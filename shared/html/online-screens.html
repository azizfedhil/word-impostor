<!-- Fragment: paste into game pages that support online play -->
        <section id="online-setup-screen" class="screen" aria-label="إعدادات الأونلاين" hidden aria-hidden="true">
            <h2>🌐 العب أونلاين</h2>
            <p style="margin-bottom:24px;">كل واحد يلعب من تلفونو 📱</p>
            <div style="margin-bottom:20px;">
                <label style="font-weight:700; margin-bottom:8px; display:block;">اسمك في اللعبة:</label>
                <input type="text" id="online-player-name" placeholder="اسمك" maxlength="20" autocomplete="off"/>
            </div>
            <button id="create-room-btn" class="primary-btn">🏠 اعمل روم جديدة</button>
            <div class="divider">ادخل لروم موجودة</div>
            <div class="join-flow-group">
                <input type="text" id="room-code-input" class="code-input-lg" placeholder="ABCD12" maxlength="6" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" style="flex:2; min-width:0;"/>
                <button id="join-room-btn" class="primary-btn" style="flex:1; margin:0; padding:14px 10px; font-size:1.1rem;">🚪 انضم</button>
            </div>
            <div class="divider">أو امسح كود QR</div>
            <button id="open-scanner-btn" class="secondary-btn" style="margin-bottom:16px;">📷 امسح الكود</button>
            <div id="reader-container" style="display: none; margin-bottom: 20px;">
                <div id="reader" style="width: 100%; border-radius: 20px; overflow: hidden; border: 1px solid var(--border-color);"></div>
            </div>
            <button id="back-to-setup-btn" class="danger-btn" style="margin-top:10px; background:transparent; color:var(--danger-color); border:none; box-shadow:none;">↩️ ارجع للإعدادات</button>
            <p id="online-setup-error" style="color:var(--danger-color); font-weight:700; margin-top:10px; text-align:center;"></p>
        </section>

        <section id="online-lobby-screen" class="screen" aria-label="لوبي الأونلاين" hidden aria-hidden="true">
            <h2>🕹️ الغرفة</h2>
            <div class="room-code-box">
                <span style="color:var(--text-muted); font-weight:700;">كود الروم:</span>
                <span id="display-room-code" class="room-code">------</span>
                <div id="qrcode-container" style="display:flex; justify-content:center; margin: 10px 0; display: none;">
                    <div id="qrcode" style="padding: 10px; background: white; border-radius: 12px; border: 1px solid #eee;"></div>
                </div>
                <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
                    <button id="copy-code-btn" class="icon-btn" style="width:auto; padding:0 20px; font-size:1rem;">📋 كوبي</button>
                    <button id="share-code-btn" class="primary-btn" style="width:auto; padding:10px 20px; font-size:1rem; margin:0;">📤 شارك</button>
                </div>
            </div>
            <div id="lobby-players-list" class="lobby-list"></div>
            <p id="lobby-wait-msg" style="text-align:center; font-weight:700;">⏳ نستنا لاعبين...</p>
            <button id="online-start-btn" class="primary-btn hidden">🚀 ابدأ اللعبة</button>
            <button id="leave-room-btn" class="danger-btn" style="margin-top:16px;">🚪 اخرج من الغرفة</button>
        </section>
