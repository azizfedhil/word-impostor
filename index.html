<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>لعبة الدخيل</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e74c3c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الدخيل">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Version bumped to 4.9 to force CSS update -->
    <link rel="stylesheet" href="style.css?v=4.9">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <header>
            <h1>🕵️‍♂️ من هو الدخيل؟</h1>
        </header>

        <div id="setup-screen" class="screen active">
            <h2>إعدادات الجولة</h2>

            <div class="settings-group">
                <label>👥 أسماء اللاعبين:</label>
                <div id="players-inputs-container"></div>
                <button type="button" id="add-player-btn" class="secondary-btn">➕ إضافة لاعب آخر</button>
            </div>

            <!-- New Side-By-Side Layout for Impostors and Timer Settings -->
            <div class="settings-row">
                <div class="setting-card" id="btn-edit-impostors">
                    <span class="label">🎭 عدد الدخلاء</span>
                    <span class="value" id="val-impostors">1</span>
                </div>
                <div class="setting-card" id="btn-edit-timer">
                    <span class="label">⏱️ مدة الجولة</span>
                    <span class="value" id="val-timer">03:00</span>
                </div>
            </div>

            <!-- Advanced options collapsible -->
            <div class="advanced-wrapper">
                <button type="button" id="advanced-toggle-btn" class="advanced-toggle-btn">
                    <span>🔧 خيارات متقدمة</span>
                    <span class="chevron" id="advanced-chevron">▼</span>
                </button>
                <div id="advanced-panel" class="advanced-panel">
                    <div class="advanced-inner">
                        <div class="settings-group checkbox-group">
                            <input type="checkbox" id="random-impostors-toggle">
                            <label for="random-impostors-toggle">🎲 عدد عشوائي من الدخلاء</label>
                        </div>
                        <div class="settings-group checkbox-group">
                            <input type="checkbox" id="all-impostors-toggle">
                            <label for="all-impostors-toggle">😈 وضع الفوضى</label>
                        </div>
                        <div class="settings-group checkbox-group">
                            <input type="checkbox" id="elimination-mode">
                            <label for="elimination-mode">⚔️ وضع الاستبعاد</label>
                        </div>
                        <div class="settings-group checkbox-group">
                            <input type="checkbox" id="no-hints-toggle">
                            <label for="no-hints-toggle">🙈 إخفاء التلميح عن الدخيل</label>
                        </div>
                        <div class="settings-group checkbox-group">
                            <input type="checkbox" id="all-correct-hints-toggle">
                            <label for="all-correct-hints-toggle">💡 منح جميع الدخلاء التلميح الصحيح</label>
                        </div>
                    </div>
                </div>
            </div>

            <button id="start-game-btn" class="primary-btn glow-btn">🚀 بدء اللعبة</button>
            <p id="setup-error" class="error-msg"></p>
        </div>

        <div id="reveal-screen" class="screen">
            <h2>🃏 توزيع الأدوار</h2>
            <h3 id="current-player-turn-msg" style="color: var(--accent-color);"></h3>
            <p id="reveal-instructions">اضغط مطولاً على البطاقة لمعرفة دورك، عند إفلات الضغط ستختفي البطاقة.</p>
            <div id="single-card-container" class="single-card-wrapper"></div>
            <button id="next-player-btn" class="primary-btn hidden"></button>
        </div>

        <div id="timer-screen" class="screen">
            <h2>💬 وقت النقاش</h2>
            <div id="starter-player" class="starter-player"></div>
            <div id="timer-display" class="timer">03:00</div>
            <button id="go-to-vote-btn" class="danger-btn">🗳️ إنهاء النقاش والتصويت</button>
        </div>

        <div id="voting-screen" class="screen">
            <h2>🗳️ التصويت</h2>
            <p>من تعتقدون أنه الدخيل؟</p>
            <div id="voting-list" class="voting-grid"></div>
        </div>

        <div id="result-screen" class="screen">
            <h2>🏆 النتيجة</h2>
            <p id="result-message"></p>
            <div id="impostors-reveal" class="reveal-box"></div>
            <button id="next-round-btn" class="primary-btn">🔄 متابعة / جولة جديدة</button>
        </div>
    </div>

    <!-- Modal window for Impostor and Timer adjustments -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">تعديل</h3>
            <div class="stepper">
                <button id="btn-minus" class="danger-btn">-</button>
                <span id="modal-val">1</span>
                <button id="btn-plus" class="primary-btn">+</button>
            </div>
            <button id="btn-confirm" class="primary-btn">تم</button>
        </div>
    </div>

    <!-- Version bumped to 4.9 to force JS update -->
    <script src="app.js?v=4.9"></script>

   <!-- Version bumped to 4.9 to force JS update -->
    <script src="app.js?v=4.9"></script>

    <script>
      // Register standard Service Worker without the infinite-loop timestamp
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              // Optionally check for updates silently in the background
              reg.update();
              console.log('SW registered.');
            })
            .catch(err => console.warn('SW registration failed:', err));
        });

        // Safely reload ONLY if a genuine update is found and applied
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
                refreshing = true;
                window.location.reload();
            }
        });
      }
    </script>
</body>
</html>
</body>
</html>
