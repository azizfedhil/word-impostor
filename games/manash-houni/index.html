<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماناش هوني</title>
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#528c71">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script defer src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <main class="container" id="app-shell">
        <header class="app-header" id="app-header"></header>
        <section id="setup-screen" class="screen active" aria-label="إعدادات">
            <h3 data-i18n="players_label">👥 اساميكم:</h3>
            <div id="players-inputs-container"></div>
            <div class="add-player-row">
                <button id="add-player-btn" class="add-player-btn">➕ زيد واحد</button>
                <button id="reset-settings-btn" class="icon-btn">🔄</button>
            </div>
            <div class="surface-card" style="padding:10px 24px;margin-top:16px;">
                <div class="setting-row" style="border-bottom:none;">
                    <span class="setting-title" data-i18n="timer_label">⏱️ وقت الطرح</span>
                    <div class="counter-group">
                        <button class="counter-btn" id="timer-minus">−</button>
                        <span class="counter-value" id="val-timer">3</span>
                        <button class="counter-btn" id="timer-plus">+</button>
                    </div>
                </div>
            </div>
            <button id="start-game-btn" class="primary-btn" style="margin-top:16px;">🚀 وزّع الكوارط</button>
            <div class="divider">أو</div>
            <button id="open-online-btn" class="secondary-btn">🌐 العب أونلاين</button>
            <p id="setup-error" style="color:var(--danger-color);text-align:center;"></p>
        </section>
        <section id="reveal-screen" class="screen" hidden aria-hidden="true">
            <h2 style="text-align:center;">🃏 شكون شنية</h2>
            <h3 id="current-player-turn-msg" style="text-align:center;"></h3>
            <div class="card-container" id="single-card-container"></div>
            <div id="reveal-seen-panel" class="seen-panel"></div>
            <button id="next-player-btn" class="primary-btn hidden"></button>
        </section>
        <section id="timer-screen" class="screen" hidden aria-hidden="true" style="text-align:center;">
            <div id="timer-display" class="timer-display">03:00</div>
            <div class="reaction-bar hidden" id="reaction-bar"></div>
            <button id="go-to-vote-btn" class="danger-btn">🕶️ عرفنا الspy</button>
        </section>
        <section id="voting-screen" class="screen" hidden aria-hidden="true">
            <p data-i18n="who_impostor" style="text-align:center;">شكون الspy؟</p>
            <div id="voting-list" class="voting-grid"></div>
        </section>
        <section id="result-screen" class="screen" hidden aria-hidden="true">
            <h3 id="result-message" style="text-align:center;"></h3>
            <div id="impostors-reveal" class="result-box"></div>
            <button id="next-round-btn" class="primary-btn">🔄 عاود</button>
        </section>
        <section id="online-setup-screen" class="screen" hidden aria-hidden="true">
            <input type="text" id="online-player-name" placeholder="اسمك" maxlength="20"/>
            <button id="create-room-btn" class="primary-btn">🏠 روم</button>
            <div class="join-flow-group"><input id="room-code-input" class="code-input-lg" maxlength="6"/><button id="join-room-btn" class="primary-btn">انضم</button></div>
            <button id="back-to-setup-btn" class="secondary-btn">↩️</button>
            <p id="online-setup-error"></p>
        </section>
        <section id="online-lobby-screen" class="screen" hidden aria-hidden="true">
            <span id="display-room-code" class="room-code">------</span>
            <div id="lobby-players-list" class="lobby-list"></div>
            <button id="online-start-btn" class="primary-btn hidden">🚀 ابدأ</button>
            <button id="leave-room-btn" class="danger-btn">خرج</button>
        </section>
        <section id="online-card-screen" class="screen" hidden aria-hidden="true">
            <div id="online-card-container" class="card-container"></div>
            <button id="online-seen-btn" class="primary-btn hidden">✅ شفت</button>
            <div id="online-waiting-zone" class="hidden"><button id="start-discussion-btn" class="primary-btn hidden">💬 نقاش</button></div>
        </section>
    </main>
    <div id="toast-msg" class="toast"></div>
    <script type="module" src="bootstrap.js"></script>
</body>
</html>
