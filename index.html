<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدخيل — اختار لعبة</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#528c71">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الدخيل">
    <link rel="apple-touch-icon" href="icon192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="launcher-page">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <main class="container" id="app-shell">
        <header class="app-header" id="app-header"></header>
        <section id="mode-select-screen" class="screen active" aria-label="اختيار اللعبة">
            <div class="mode-choice-grid">
                <a class="mode-choice-card" href="games/shkounou-houa/">
                    <span class="mode-choice-icon">🕵️‍♂️</span>
                    <span class="mode-choice-title">شكونو هو؟</span>
                    <span class="mode-choice-sub">كلمة، كذاب، وتصويت</span>
                </a>
                <a class="mode-choice-card" href="games/sare9-hakem-jalled/">
                    <span class="mode-choice-icon">🗝️</span>
                    <span class="mode-choice-title">سارق، حاكم، جلّاد</span>
                    <span class="mode-choice-sub">الحاكم يفيق بالسارق</span>
                </a>
                <a class="mode-choice-card" href="games/manash-houni/">
                    <span class="mode-choice-icon">🕶️</span>
                    <span class="mode-choice-title">ماناش هوني</span>
                    <span class="mode-choice-sub">بلاصة، أدوار، وspy مخبي</span>
                </a>
                <a class="mode-choice-card" href="games/koul-w-bou3/">
                    <span class="mode-choice-icon">👑</span>
                    <span class="mode-choice-title">كول وبوّع</span>
                    <span class="mode-choice-sub">فلوس، تبلعيط، و"تكذب!"</span>
                </a>
                <a class="mode-choice-card" href="games/chkobba/">
                    <span class="mode-choice-icon">🃏</span>
                    <span class="mode-choice-title">شكبّة</span>
                    <span class="mode-choice-sub">كوارط، حساب، و"شكبّة!"</span>
                </a>
            </div>
        </section>
    </main>
    <div id="toast-msg" class="toast"></div>
    <script type="module" src="shared/launcher/bootstrap.js"></script>
</body>
</html>
